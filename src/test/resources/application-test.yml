spring:
  datasource:
    url: jdbc:h2:mem:auth_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: test-secret-key-with-at-least-32-chars!!
    previous-secrets:
    key-id: test
    access-ttl: 10m
    refresh-ttl: 30d
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
  cors:
    allowed-origins: http://localhost:5173
  security:
    max-failed-login-attempts: 5
    lockout-duration: 15m
    require-https: false

logging:
  level:
    root: WARN
    SECURITY_AUDIT: WARN
